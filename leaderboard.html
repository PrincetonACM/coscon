<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COSCON 2026 Leaderboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap');
        body {
            font-family: 'Lato', sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }

        .banner {
            width: 80%;
            margin: 20px auto;
        }

        .banner img {
            display: block;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="banner">
        <img src="./Header.png" alt="COSCON 2026">
    </div>
    <div style="text-align: center;">
        <h1>COSCON 2026 Live Leaderboard</h1>
        <p>Note: There may be delays in grading submissions. If you feel like a substantial
            amount of time has passed since you submitted, please let us know in Discord</p>
    </div>
    <div class="banner">
        <img src="./Footer.png" alt="COSCON sponsors">
    </div>
</body>
</html>
